<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cook-first Kitchen App — Wireframes</title>
<style>
  :root{
    --bg:#F0EFEC;
    --frame:#FFFFFF;
    --frame-border:#B9B5AC;
    --ink:#2A2724;
    --muted:#8A857C;
    --line:#D8D4CB;
    --block:#EDEBE5;
    --block-strong:#DEDAD0;
    --accent:#C9603A;
    --accent-soft:#F1D9CC;
    --tab-active:#2A2724;
    --group-bg:#E7E4DD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);
    padding:32px 24px 80px;
  }
  h1{
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subhead{
    color:var(--muted);
    font-size:13px;
    margin:0 0 36px;
    max-width:640px;
    line-height:1.5;
  }
  .group{
    margin-bottom:44px;
  }
  .group-header{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:16px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .group-header .idx{
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    background:var(--group-bg);
    border-radius:20px;
    padding:3px 10px;
  }
  .group-header h2{
    font-size:15px;
    margin:0;
    font-weight:600;
  }
  .group-header .note{
    font-size:12px;
    color:var(--muted);
    margin-left:auto;
  }
  .row{
    display:flex;
    flex-wrap:wrap;
    gap:22px;
  }
  .phone{
    width:230px;
    background:var(--frame);
    border:1px solid var(--frame-border);
    border-radius:22px;
    padding:8px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
    flex-shrink:0;
  }
  .phone-inner{
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:420px;
    background:#fff;
  }
  .screen-label{
    font-size:11.5px;
    font-weight:600;
    color:var(--ink);
    margin:10px 2px 6px;
  }
  .screen-num{
    color:var(--muted);
    font-weight:400;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px 8px;
    font-size:10.5px;
    color:var(--muted);
    border-bottom:1px solid var(--line);
  }
  .topbar .app-title{
    color:var(--ink);
    font-weight:600;
    font-size:11.5px;
  }
  .content{
    flex:1;
    overflow-y:auto;
    padding:10px 10px 6px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .b-title{
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    margin-top:2px;
  }
  .b-text{
    font-size:9.5px;
    color:var(--muted);
    line-height:1.4;
  }
  .b-input{
    border:1px solid var(--line);
    background:var(--block);
    border-radius:9px;
    padding:8px 9px;
    font-size:9.5px;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .b-input .mic{
    width:14px;height:14px;border-radius:50%;
    background:var(--accent-soft);
    display:inline-block;
    flex-shrink:0;
  }
  .b-button{
    background:var(--ink);
    color:#fff;
    border-radius:9px;
    padding:8px 10px;
    font-size:10px;
    font-weight:600;
    text-align:center;
  }
  .b-button.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .b-button.accent{
    background:var(--accent);
  }
  .b-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px;
    background:#fdfdfc;
  }
  .b-card .card-top{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    font-weight:600;
    margin-bottom:3px;
  }
  .b-card .card-sub{
    font-size:9px;
    color:var(--muted);
  }
  .b-card.two{
    display:flex;
    gap:6px;
  }
  .b-card.two .half{
    flex:1;
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px;
  }
  .b-card.two .half .htitle{
    font-size:9.5px;
    font-weight:700;
  }
  .b-card.two .half .hsub{
    font-size:8.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .b-list .item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--line);
    padding:6px 2px;
    font-size:9.5px;
  }
  .b-list .item:last-child{border-bottom:none;}
  .b-list .item .toggle{
    width:26px;height:14px;
    border-radius:8px;
    background:var(--block-strong);
    position:relative;
    flex-shrink:0;
  }
  .b-list .item .toggle::after{
    content:"";
    position:absolute;
    width:10px;height:10px;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--line);
    top:1.5px;left:2px;
  }
  .b-chips{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
  }
  .chip{
    background:var(--block);
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 9px;
    font-size:8.5px;
    color:var(--ink);
  }
  .chip.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .b-stepper{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .b-stepper .step{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:9px;
  }
  .b-stepper .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--block-strong);
    flex-shrink:0;
  }
  .b-stepper .dot.done{background:var(--ink);}
  .b-imgph{
    height:44px;
    border-radius:8px;
    background:repeating-linear-gradient(45deg,var(--block),var(--block) 6px,#fff 6px,#fff 12px);
    border:1px solid var(--line);
  }
  .b-divider{
    height:1px;
    background:var(--line);
    margin:2px 0;
  }
  .b-mic-big{
    height:70px;
    border-radius:14px;
    background:var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    color:var(--accent);
    font-weight:600;
  }
  .tabbar{
    display:flex;
    border-top:1px solid var(--line);
    padding:7px 4px 8px;
  }
  .tabbar .tab{
    flex:1;
    text-align:center;
    font-size:8px;
    color:var(--muted);
  }
  .tabbar .tab .ic{
    width:14px;height:14px;
    border-radius:4px;
    background:var(--block-strong);
    margin:0 auto 3px;
  }
  .tabbar .tab.active{color:var(--tab-active);font-weight:700;}
  .tabbar .tab.active .ic{background:var(--tab-active);}
  .tabbar.hidden{visibility:hidden;height:0;padding:0;border:none;}
  .overlay-tag{
    display:inline-block;
    font-size:9px;
    color:var(--accent);
    border:1px solid var(--accent-soft);
    background:var(--accent-soft);
    border-radius:6px;
    padding:2px 6px;
    margin-bottom:4px;
    align-self:flex-start;
  }
</style>
</head>
<body>

<h1>Cook-first Kitchen App — Screen Wireframes</h1>
<p class="subhead">Structural wireframes: layout, hierarchy, and content per screen. Not final visual design — colors, icons and type are placeholders. 4 bottom tabs: Home · Kitchen · Order · Profile. Onboarding and shared screens sit outside the tab bar.</p>

<div id="app"></div>

<script>
const TABS = ["Home","Kitchen","Order","Profile"];

function tabbar(active){
  if(active === null) return `<div class="tabbar hidden"></div>`;
  return `<div class="tabbar">${TABS.map(t=>`<div class="tab ${t===active?'active':''}"><div class="ic"></div>${t}</div>`).join('')}</div>`;
}

function block(b){
  switch(b.t){
    case 'title': return `<div class="b-title">${b.v}</div>`;
    case 'text': return `<div class="b-text">${b.v}</div>`;
    case 'input': return `<div class="b-input"><span>${b.v}</span>${b.mic?'<span class="mic"></span>':''}</div>`;
    case 'button': return `<div class="b-button ${b.style||''}">${b.v}</div>`;
    case 'card': return `<div class="b-card"><div class="card-top"><span>${b.v}</span><span>${b.right||''}</span></div>${b.sub?`<div class="card-sub">${b.sub}</div>`:''}</div>`;
    case 'cardtwo': return `<div class="b-card two">
        <div class="half"><div class="htitle">${b.left.title}</div><div class="hsub">${b.left.sub}</div></div>
        <div class="half"><div class="htitle">${b.right.title}</div><div class="hsub">${b.right.sub}</div></div>
      </div>`;
    case 'list': return `<div class="b-list">${b.items.map(i=>`<div class="item"><span>${i}</span>${b.toggle?'<span class="toggle"></span>':'<span>›</span>'}</div>`).join('')}</div>`;
    case 'chips': return `<div class="b-chips">${b.items.map((i,idx)=>`<span class="chip ${b.active===idx?'active':''}">${i}</span>`).join('')}</div>`;
    case 'stepper': return `<div class="b-stepper">${b.items.map((i,idx)=>`<div class="step"><span class="dot ${idx<=(b.done||0)?'done':''}"></span>${i}</div>`).join('')}</div>`;
    case 'img': return `<div class="b-imgph"></div>`;
    case 'divider': return `<div class="b-divider"></div>`;
    case 'mic': return `<div class="b-mic-big">${b.v}</div>`;
    case 'overlaytag': return `<div class="overlay-tag">${b.v}</div>`;
    default: return '';
  }
}

function phone(screen, num){
  return `
  <div>
    <div class="screen-label"><span class="screen-num">${num}.</span> ${screen.title}</div>
    <div class="phone">
      <div class="phone-inner">
        <div class="topbar"><span>${screen.back?'‹ back':'9:41'}</span><span class="app-title">${screen.appTitle||''}</span><span>${screen.right||''}</span></div>
        <div class="content">${screen.blocks.map(block).join('')}</div>
        ${tabbar(screen.tab===undefined?null:screen.tab)}
      </div>
    </div>
  </div>`;
}

const app = document.getElementById('app');
let counter = 0;
DATA.forEach((group, gi)=>{
  const div = document.createElement('div');
  div.className = 'group';
  div.innerHTML = `
    <div class="group-header">
      <span class="idx">${gi+1}</span>
      <h2>${group.title}</h2>

    </div>
  `;
  app.appendChild(div);
});
</script>

</html>
